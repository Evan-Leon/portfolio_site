server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Multi-page static site (projects/<slug>.html) — NOT a single-page app,
    # so no index.html catch-all fallback. Serve the real file if it exists,
    # allow extensionless links to resolve to their .html file, then 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve the site's own 404 page for anything that doesn't resolve.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
