      }

      /* DT13 EDIT: the shipped ::after is a faint 420px purple band; it becomes
         THE ROAD — darker asphalt, 4px edge lines, a 14px dashed centre line
         (dashes 140px of Z, gaps 180px). All on the ground plane, so it recedes
         with the perspective. Exactly the wireframe's rule. */
      .sds-lot__ground::after {
        position: absolute;
        top: 0;
        left: 50%;
        width: 420px;
        height: 100%;
        margin-left: -210px;
        background:
          repeating-linear-gradient(
              180deg,
              var(--sds-road-line) 0 140px,
              transparent 140px 320px
            )
            center top / 14px 100% no-repeat,
          linear-gradient(
            90deg,
            var(--sds-road-edge) 0 4px,
            transparent 4px calc(100% - 4px),
            var(--sds-road-edge) calc(100% - 4px)
          ),
          color-mix(in srgb, var(--sds-asphalt) 78%, black);
        content: "";
      }

      /* DIAGNOSTIC ONLY (&road=lifted) — never production. The rule above puts
         the road at exactly the asphalt's depth; measured, both are their own
         composited layer (420x20800 and 4000x20800) at the same Z, which is the
         classic z-fighting setup. This lifts it clear so the two surfaces have
         an order. Default is OFF: the page as shipped is DT13 as specified.

         THE SIGN IS NEGATIVE, AND THAT IS NOT A TYPO. The parent is rotated
         `rotateX(-90deg)`, which maps a child's local +Z onto world *down*
         (rotateX by -90 sends local (0,0,1) to (0,1,0), and CSS y points down).
         So `translateZ(1px)` pushes the road 1px UNDER the asphalt, where the
         opaque plane hides it — Evan hit exactly that on 2026-09-08: the road
         vanished, and flickered back into view on scroll-back. Negative is up,
         out of the ground, toward the sky.

         Headless Chromium cannot check this: renders at translateZ of none,
         +1px, -1px and -4px are pixel-identical (2148 road-line pixels each),
         because software rasterisation sorts coplanar surfaces deterministically
         and never shows the artifact. Real GPU hardware is the only instrument
         here, the same way it is for fps. */
      .sds-lot[data-road="lifted"] .sds-lot__ground::after {
        transform: translateZ(-1px);
      }

      .sds-screen {
        pointer-events: auto;
        position: absolute;
        bottom: calc(100% - var(--sds-ground-line));
        left: 50%;
        display: flex;
        width: 520px;
        flex-direction: column;
        align-items: center;
        margin-left: -260px;
        transform: translate3d(
            var(--sds-screen-x, 0px),
            0px,
            var(--sds-screen-z, 0px)
          )
          rotateY(var(--sds-screen-yaw, 0deg));
        transform-style: preserve-3d;
      }

      .sds-screen__surface {
        position: relative;
        display: block;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 10;
        border: 6px solid var(--sds-screen-bezel);
        border-radius: var(--sds-radius-sm);
        background: var(--sds-screen-dark);
        box-shadow:
          0 0 60px color-mix(in srgb, var(--sds-screen-dark) 60%, transparent),
          0 0 60px
            color-mix(
              in srgb,
              var(--sds-marquee) calc(var(--sds-screen-lit, 0) * 10%),
              transparent
            );
        /* The production expression. The timeline tweens the NUMBER; the CSS
           derives the look. DTF tweened `filter` directly — not this. */
        filter: brightness(calc(0.35 + 0.65 * var(--sds-screen-lit, 0)));
      }

      .sds-screen__surface[data-poster="missing"] {
        background:
          repeating-linear-gradient(
            135deg,
            transparent 0 12px,
            color-mix(in srgb, var(--sds-star) 3%, transparent) 12px 24px
          ),
          var(--sds-screen-dark);
      }

      .sds-screen__poster,
      .sds-screen__video {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }

      .sds-screen__video {
        z-index: 1;
      }

      .sds-screen__base {
        position: relative;
        width: 100%;
        height: 96px;
      }

      .sds-screen__post {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 14px;
        background: var(--sds-screen-post);
      }

      .sds-screen__post--l {
        left: 70px;
      }

      .sds-screen__post--r {
        right: 70px;
      }

      .sds-screen__marquee {
        position: absolute;
        top: 14px;
        left: 50%;
        overflow: hidden;
        width: 320px;
        padding: var(--sds-space-2) var(--sds-space-4);
        border: 3px solid
          color-mix(
            in srgb,
            var(--sds-marquee-edge-lit) calc(var(--sds-screen-lit, 0) * 100%),
            var(--sds-marquee-edge)
          );
        border-radius: 6px;
        background: color-mix(
          in srgb,
          var(--sds-marquee) calc(var(--sds-screen-lit, 0) * 100%),
          var(--sds-marquee-dim)
        );
        box-shadow: 0 0 14px
          color-mix(
            in srgb,
            var(--sds-marquee) calc(var(--sds-screen-lit, 0) * 30%),
            transparent
          );
        color: var(--sds-marquee-ink);
        font-size: 1.125rem;
        font-weight: var(--sds-weight-bold);
        letter-spacing: 0.02em;
        text-align: center;
        text-overflow: ellipsis;
        text-transform: uppercase;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      /* The Tab half of the hit test. The shipped rule is `outline: none` plus a
         box-shadow ring; kept, and made loud enough to see on a far screen. */
      .sds-screen:focus-visible {
        outline: none;
      }

      .sds-screen:focus-visible .sds-screen__surface {
        box-shadow:
          0 0 0 3px var(--sds-star),
          0 0 40px var(--sds-marquee);
      }

      /* ===================================================================
       * SCENERY — from the spec's "Scenery" section and the wireframe's rules.
       * `.sds-tree` is a plain masked plane: no filter, no transform-style of
       * its own.
       * =================================================================== */
      .sds-tree {
        position: absolute;
        bottom: calc(100% - var(--sds-ground-line));
        left: 50%;
        width: 260px;
        height: 390px;
        margin-left: -130px;
        background: var(--sds-tree);
        /* Longhands, not the `mask` shorthand: the mask IMAGE is written from JS
           once the source is built, and a shorthand in this rule would reset it
           back to `none` depending on order. */
        -webkit-mask-position: center bottom;
        -webkit-mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-position: center bottom;
        mask-size: contain;
        mask-repeat: no-repeat;
        transform: translate3d(
            var(--sds-tree-x, 0px),
            0,
            var(--sds-tree-z, 0px)
          )
          scale(var(--sds-tree-scale, 1));
        transform-origin: 50% 100%;
        pointer-events: none;
        /* An unset mask-image computes to `none` and paints the plane's whole
           RECTANGLE in --sds-tree. A pending or failed mask must be invisible,
           never a grey box (the spec's measured note). */
        visibility: hidden;
      }

      .sds-tree[data-mask="ready"] {
        visibility: visible;
      }

      /* ===================================================================
       * THE CAR — anchored to the STAGE, not the world, so the lot drives past
       * it. From the wireframe's `.lot__orb` / `.lot__beam` / `.lot__car`.
       * =================================================================== */
      .sds-lot__orb {
        position: absolute;
        z-index: 0;
        top: var(--sds-orb-y);
        left: var(--sds-orb-x);
        width: var(--sds-orb-size);
        height: var(--sds-orb-size);
        margin: calc(var(--sds-orb-size) / -2) 0 0 calc(var(--sds-orb-size) / -2);
        border-radius: 50%;
        background: var(--sds-orb);
        box-shadow: 0 0 var(--sds-orb-halo-size) var(--sds-orb-halo);
        pointer-events: none;
      }

      .sds-lot__beam {
        position: absolute;
        z-index: 2;
        bottom: 22%;
        left: 50%;
        width: 46%;
        height: 20%;
        background: linear-gradient(to top, var(--sds-beam), transparent);
        clip-path: polygon(30% 100%, 70% 100%, 56% 0, 44% 0);
        opacity: var(--sds-headlight);
        transform: translateX(-50%);
        pointer-events: none;
      }

      .sds-lot__car {
        position: absolute;
        z-index: 3;
        bottom: -1%;
        left: 50%;
        width: clamp(320px, 38vw, 620px);
        /* Keeps the wrapper's height (and therefore the glows' box) when the
           sprite is missing — the review measured 0px without it. */
        aspect-ratio: 16 / 9;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .sds-lot__car img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* The two blurred tail-light glows — the per-frame raster cost DTF never
         had, and one of the three reasons this probe exists. */
      .sds-lot__car::before,
      .sds-lot__car::after {
        position: absolute;
        bottom: 34%;
        width: 22%;
        height: 18%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(255, 70, 60, 0.55),
          transparent
        );
        opacity: var(--sds-headlight);
        filter: blur(6px);
        content: "";
      }

      .sds-lot__car::before {
        left: 9%;
      }

      .sds-lot__car::after {
        right: 9%;
      }

      /* Narrow layout, transcribed from global.css's 767px block plus the
         wireframe's scenery lines. Not measured — the protocol is 1440x900 —
         but present so the transcription is complete. */
      @media (max-width: 767px) {
        .sds-lot {
          perspective: 600px;
        }

        .sds-screen {
          --sds-screen-x: 0px !important;
          --sds-screen-yaw: 0deg !important;

          width: 300px;
          margin-left: -150px;
        }

        .sds-screen__marquee {
          width: 220px;
          font-size: 0.9rem;
        }

        .sds-tree {
          --sds-tree-x: 0px !important;

          width: 180px;
          height: 270px;
          margin-left: -90px;
        }

        .sds-tree--left {
          transform: translate3d(-360px, 0, var(--sds-tree-z, 0px))
            scale(var(--sds-tree-scale, 1));
        }

        .sds-tree--right {
          transform: translate3d(360px, 0, var(--sds-tree-z, 0px))
            scale(var(--sds-tree-scale, 1));
        }

        .sds-lot__car {
          width: 64vw;
        }

        .sds-lot__beam {
          width: 70%;
        }
      }
    </style>
  </head>

  <body>
    <div class="hud">
      <span id="hud-label">variant</span>
      <a href="?variant=lot20" data-v="lot20">lot20</a>
      <a href="?variant=car-only" data-v="car-only">car-only</a>
      <a href="?variant=scenery" data-v="scenery">scenery</a>
      <a href="?variant=scenery-half" data-v="scenery-half">scenery-half</a>
      <a href="?variant=scenery-overload" data-v="scenery-overload"
        >scenery-overload</a
      >
      <span id="hud-status"></span>
    </div>

    <!-- The drivable classifier self-test. Empty and hidden until
         ?selftest=verdict fills it; present in the markup so a driver can wait
         on the element rather than on a script having run. -->
    <pre id="verdict-selftest" hidden></pre>

    <div id="stage"></div>
    <div class="spacer"></div>

    <script>
      /* -------------------------------------------------------------------
       * Set this to one of VARIANTS to pin a variant regardless of the query
       * string. null = use ?variant= (default 'scenery').
       * ----------------------------------------------------------------- */
      const VARIANT_OVERRIDE = null;

      const VARIANTS = [
        "lot20",
        "car-only",
        "scenery",
        "scenery-half",
        "scenery-overload",
      ];
      const PARAMS = new URLSearchParams(location.search);
      const requested = PARAMS.get("variant");
      const VARIANT =
        VARIANT_OVERRIDE || (VARIANTS.includes(requested) ? requested : "scenery");

      /* Which mask source the tree planes use. See the header. */
      const MASK_SRC = PARAMS.get("masksrc") === "svg" ? "svg" : "png";

      /* ===================================================================
       * GEOMETRY — inlined from theater/src/lot/geometry.ts. A file:// page
       * cannot import the module, so these are copies; if geometry.ts changes,
       * this probe is stale.
       * =================================================================== */
      const SPACING = 800; // px of Z between screens
      const OFFSET = 480; // px of X, alternating sides
      const YAW_DEG = 18; // degrees, alternating sign
      const GROUND_LINE = 0.58; // fraction of the stage height
      const VH_PER_SCREEN = 120; // matches the .spacer height above

      /*
       * EVO-UNI-128: a SNAPSHOT of theater/src/projects.ts's length on
       * 2026-09-08, not a value read from the registry. A re-run must re-read
       * the registry first — every tree count below is derived from this.
       */
      const SCREEN_COUNT = 20;

      const screenPlacement = (i) => ({
        x: i % 2 === 0 ? -OFFSET : OFFSET,
        z: -(i + 1) * SPACING,
        yaw: i % 2 === 0 ? YAW_DEG : -YAW_DEG,
      });
      const lotZ = (progress, count) =>
        Math.min(1, Math.max(0, progress)) * SPACING * (count + 1);
      const screenProgress = (i, count) => (i * SPACING) / (SPACING * (count + 1));

      const BAND_EPSILON = 1e-9;
      const activeScreen = (progress, count) => {
        const i = Math.floor(
          Math.min(1, Math.max(0, progress)) * (count + 1) + BAND_EPSILON,
        );
        return i >= 0 && i < count ? i : -1;
      };

      /* DT13's two ground numbers, from the spec. */
      const GROUND_LEAD = SPACING; // 800
      const GROUND_DEPTH_SPEC = lotZ(1, SCREEN_COUNT) + 5 * SPACING; // 20800

      /* ===================================================================
       * DIAGNOSTIC SWITCHES — added 2026-09-08 after Evan reported the whole
       * scene blinking during scroll in EVERY variant, `lot20` included. They
       * exist to tell two candidate causes apart and are NOT part of the
       * measurement: a median taken with either flag set is a number about the
       * flag, not about the scenery, and must be labelled as such.
       *
       * WHAT WAS MEASURED, on the probe as specified (Chromium, dpr 1):
       *   MAX_TEXTURE_SIZE                  8192 px
       *   .sds-lot__ground composited layer 4000 x 20800 = 83.2 Mpx
       *   .sds-lot__ground::after (road)     420 x 20800 =  8.7 Mpx,
       *                                     transform: none — i.e. COPLANAR
       *                                     with the asphalt it sits on
       *   whole page                        145 Mpx  (~580 MB of texture)
       * Capping the depth at 8000 takes the page to 89 Mpx (~357 MB).
       *
       * &ground=<px>   overrides GROUND_DEPTH. The spec's 20800 is 2.5x the
       *                texture limit in one dimension, so Chromium must tile
       *                the plane; tiles evicted under memory pressure and
       *                re-drawn are what a blink looks like.
       * &road=lifted   gives the road 1px of Z so it is no longer exactly
       *                coplanar with the asphalt. Two surfaces at identical
       *                depth fight over which is in front, every frame.
       *
       * Both are OFF by default, so the default page is still DT13 exactly as
       * specified. The HUD names whichever is on — if the HUD does not say so,
       * the flag did not take.
       * =================================================================== */
      const groundOverride = Number(PARAMS.get("ground"));
      const GROUND_DEPTH =
        Number.isFinite(groundOverride) && groundOverride > 0
          ? groundOverride
          : GROUND_DEPTH_SPEC;
      const ROAD_LIFTED = PARAMS.get("road") === "lifted";
      /* Carried across the harness walk's self-navigation, so a walk started
         with a flag does not silently drop it at the first variant change. */
      const FLAG_QUERY =
        (MASK_SRC === "svg" ? "&masksrc=svg" : "") +
        (GROUND_DEPTH !== GROUND_DEPTH_SPEC ? `&ground=${GROUND_DEPTH}` : "") +
        (ROAD_LIFTED ? "&road=lifted" : "");

      /* ===================================================================
       * SCENERY ARITHMETIC — from the spec's "Scenery" section. A table, never
       * Math.random: a rebuilt scene must look identical (SDS-001).
       * =================================================================== */
      const TREE_SETBACK = 420;
      const TREE_LEAD = 100;
      const TREE_VARIANTS = 3;
      const TREE_JITTER = [
        { dx: 0, scale: 1.05 },
        { dx: 60, scale: 0.9 },
        { dx: 0, scale: 1.15 },
        { dx: 40, scale: 0.95 },
        { dx: 0, scale: 1.1 },
        { dx: 80, scale: 1.0 },
        { dx: 0, scale: 1.05 },
        { dx: 40, scale: 0.9 },
      ];

      /* Left trees first, then right; the rows alternate by half a spacing. */
      function treePlacements(count, spacing) {
        const limit = -(lotZ(1, count) + SPACING);
        const out = [];
        for (const side of ["left", "right"]) {
          const right = side === "right";
          const lead = TREE_LEAD + (right ? spacing / 2 : 0);
          for (let i = 0; ; i++) {
            const z = -(lead + i * spacing);
            if (z < limit) break;
            const jitter = TREE_JITTER[(i + (right ? 3 : 0)) % TREE_JITTER.length];
            out.push({
              side,
              x: (right ? 1 : -1) * (OFFSET + TREE_SETBACK + jitter.dx),
              z,
              scale: jitter.scale,
              variant: (i + (right ? 1 : 0)) % TREE_VARIANTS,
            });
          }
        }
        return out;
      }

      /* 400 -> 88 planes, 800 -> 44, 100 -> 351 (176 left + 175 right). */
      const TREE_SPACING_BY_VARIANT = {
        scenery: 400,
        "scenery-half": 800,
        "scenery-overload": 100,
      };
      const TREE_SPACING = TREE_SPACING_BY_VARIANT[VARIANT] || null;
      const HAS_CAR = VARIANT !== "lot20";

      /* ===================================================================
       * THE TWENTY PROJECTS — hardcoded from theater/src/projects.ts as of
       * 2026-09-08 (EVO-UNI-128; see the note above). `clip: null` is a screen
       * that has no images/<slug>/demo.mp4 on disk and falls back to its poster
       * in production; re-probed on disk 2026-09-08 and there are four.
       * =================================================================== */
      const PROJECTS = [
        {
          slug: "budget-app",
          name: "Leon's Budget",
          href: "../../projects/budget-app.html",
          poster: "../../images/budget-app/01.png",
          clip: "../../images/budget-app/demo.mp4",
        },
        {
          slug: "nom-noms",
          name: "Nom Nom's",
          href: "../../projects/nom-noms.html",
          poster: "../../images/nom-noms/01.png",
          clip: "../../images/nom-noms/demo.mp4",
        },
        {
          slug: "el-blackjack",
          name: "El Blackjack",
          href: "../../projects/el-blackjack.html",
          poster: "../../images/el-blackjack/01.png",
          clip: "../../images/el-blackjack/demo.mp4",
        },
        {
          slug: "classic-golf",
          name: "The Classic",
          href: "../../projects/classic-golf.html",
          poster: "../../images/classic-golf/01.png",
          clip: "../../images/classic-golf/demo.mp4",
        },
        {
          slug: "spead-read",
          name: "Spead Read",
          href: "../../projects/spead-read.html",
          poster: "../../images/spead-read/01.png",
          clip: null,
        },
        {
          slug: "chunk-norris",
          name: "Chunk Norris",
          href: "../../projects/chunk-norris.html",
          poster: "../../images/chunk-norris/01.png",
          clip: "../../images/chunk-norris/demo.mp4",
        },
        {
          slug: "app-dash",
          name: "app-dash",
          href: "../../projects/app-dash.html",
          poster: "../../images/app-dash/01.png",
          clip: "../../images/app-dash/demo.mp4",
        },
        {
          slug: "prompt-heus",
          name: "Prompt-heus",
          href: "../../projects/prompt-heus.html",
          poster: "../../images/prompt-heus/01.png",
          clip: "../../images/prompt-heus/demo.mp4",
        },
        {
          slug: "voice-trainer",
          name: "Voice Trainer",
          href: "../../projects/voice-trainer.html",
          poster: "../../images/voice-trainer/01.png",
          clip: "../../images/voice-trainer/demo.mp4",
        },
        {
          slug: "chudios",
          name: "chudios",
          href: "../../projects/chudios.html",
          poster: "../../images/chudios/01.png",
          clip: "../../images/chudios/demo.mp4",
        },
        {
          slug: "chud",
          name: "CHUD",
          href: "../../projects/chud.html",
          poster: "../../images/chud/01.png",
          clip: "../../images/chud/demo.mp4",
        },
        {
          slug: "co-host",
          name: "co-host",
          href: "../../projects/co-host.html",
          poster: "../../images/co-host/01.png",
          clip: "../../images/co-host/demo.mp4",
        },
        {
          slug: "mind-palace",
          name: "Mind Palace",
          href: "../../projects/mind-palace.html",
          poster: "../../images/mind-palace/01.png",
          clip: "../../images/mind-palace/demo.mp4",
        },
        {
          slug: "logson",
          name: "Logson",
          href: "../../projects/logson.html",
          poster: "../../images/logson/01.png",
          clip: "../../images/logson/demo.mp4",
        },
        {
          slug: "graces-tree",
          name: "Grace's Tree",
          href: "../../projects/graces-tree.html",
          poster: "../../images/graces-tree/01.png",
          clip: "../../images/graces-tree/demo.mp4",
        },
        {
          slug: "journow",
          name: "jourNOW",
          href: "../../projects/journow.html",
          poster: "../../images/journow/01.png",
          clip: "../../images/journow/demo.mp4",
        },
        {
          slug: "co-author",
          name: "Co-Author",
          href: "../../projects/co-author.html",
          poster: "../../images/co-author/01.png",
          clip: "../../images/co-author/demo.mp4",
        },
        {
          slug: "media-cloud-web-tools",
          name: "Media Cloud Web Tools",
          href: "../../projects/media-cloud-web-tools.html",
          poster: "../../images/media-cloud-web-tools/01.png",
          clip: null,
        },
        {
          slug: "media-cloud-vitals",
          name: "Media Cloud Vitals",
          href: "../../projects/media-cloud-vitals.html",
          poster: "../../images/media-cloud-vitals/01.png",
          clip: null,
        },
        {
          slug: "showrunner-digest",
          name: "ShowRunner Digest",
          href: "../../projects/showrunner-digest.html",
          poster: "../../images/showrunner-digest/01.png",
          clip: null,
        },
      ];

      const BANDS = SCREEN_COUNT + 1;
      const LIT_IN_BANDS = 0.15;
      const LIT_OUT_BANDS = 0.05;

      const stage = document.getElementById("stage");
      const hudStatus = document.getElementById("hud-status");
      document.getElementById("hud-label").textContent = VARIANT.toUpperCase();
      for (const a of document.querySelectorAll(".hud a")) {
        if (a.dataset.v === VARIANT) a.setAttribute("aria-current", "true");
      }

      function fatal(message) {
        const el = document.createElement("div");
        el.className = "fatal";
        el.textContent = message;
        document.body.appendChild(el);
      }

      /* ===================================================================
       * MASK SOURCE 1 (default): three silhouettes drawn in-page on an 800x1200
       * canvas. The probe must not depend on DT14's art existing.
       *
       * Drawn in the 200x300 space the wireframe's placeholders use, scaled x4,
       * so both mask sources describe the same three plants at the contract's
       * canvas size.
       * =================================================================== */
      const MASK_W = 800;
      const MASK_H = 1200;

      function drawDeciduous(ctx) {
        ctx.beginPath();
        ctx.moveTo(100, 20);
        ctx.bezierCurveTo(150, 20, 190, 70, 185, 130);
        ctx.bezierCurveTo(200, 160, 190, 210, 150, 225);
        ctx.lineTo(112, 232);
        ctx.lineTo(112, 300);
        ctx.lineTo(88, 300);
        ctx.lineTo(88, 232);
        ctx.lineTo(50, 225);
        ctx.bezierCurveTo(10, 210, 0, 160, 15, 130);
        ctx.bezierCurveTo(10, 70, 50, 20, 100, 20);
        ctx.closePath();
        ctx.fill();
      }

      function drawConifer(ctx) {
        /* The wireframe's tree--1 path, verbatim in the 200x300 space. */
        ctx.beginPath();
        ctx.moveTo(100, 0);
        ctx.lineTo(150, 90);
        ctx.lineTo(128, 90);
        ctx.lineTo(172, 170);
        ctx.lineTo(146, 170);
        ctx.lineTo(196, 260);
        ctx.lineTo(112, 260);
        ctx.lineTo(112, 300);
        ctx.lineTo(88, 300);
        ctx.lineTo(88, 260);
        ctx.lineTo(4, 260);
        ctx.lineTo(54, 170);
        ctx.lineTo(28, 170);
        ctx.lineTo(72, 90);
        ctx.lineTo(50, 90);
        ctx.closePath();
        ctx.fill();
      }

      function drawTall(ctx) {
        ctx.beginPath();
        ctx.moveTo(100, 0);
        ctx.bezierCurveTo(130, 40, 140, 70, 135, 110);
        ctx.bezierCurveTo(160, 130, 165, 180, 150, 220);
        ctx.lineTo(112, 236);
        ctx.lineTo(112, 300);
        ctx.lineTo(88, 300);
        ctx.lineTo(88, 236);
        ctx.lineTo(50, 220);
        ctx.bezierCurveTo(35, 180, 40, 130, 65, 110);
        ctx.bezierCurveTo(60, 70, 70, 40, 100, 0);
        ctx.closePath();
        ctx.fill();
      }

      const CANVAS_SILHOUETTES = [drawDeciduous, drawConifer, drawTall];

      function buildCanvasMasks() {
        return CANVAS_SILHOUETTES.map((draw) => {
          const canvas = document.createElement("canvas");
          canvas.width = MASK_W;
          canvas.height = MASK_H;
          const ctx = canvas.getContext("2d");
          ctx.scale(MASK_W / 200, MASK_H / 300);
          ctx.fillStyle = "#000";
          draw(ctx);
          return canvas.toDataURL("image/png");
        });
      }

      /* ===================================================================
       * MASK SOURCE 2 (&masksrc=svg): the exported intrinsic-size placeholders.
       *
       * Copied from docs/wireframes/theater-drive-in-theme.html's `.tree--1/2/3`
       * --tree-mask declarations on 2026-09-08, with the explicit width/height
       * the art contract requires added to the root element (the wireframe's
       * inline URIs carry a viewBox and no intrinsic size, so as files they
       * measure 100x150 and fail every dimension check). These are the SAME
       * strings docs/spikes/art-check.html offers under "download placeholder
       * set" — the two files must be kept in step by hand.
       * =================================================================== */
      const TREE_SVGS = [
        `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 200 300"><path d="M100 0 L150 90 L128 90 L172 170 L146 170 L196 260 L112 260 L112 300 L88 300 L88 260 L4 260 L54 170 L28 170 L72 90 L50 90 Z" fill="black"/></svg>`,
        `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 200 300"><path d="M100 20 C150 20 190 70 185 130 C200 160 190 210 150 225 L112 232 L112 300 L88 300 L88 232 L50 225 C10 210 0 160 15 130 C10 70 50 20 100 20 Z" fill="black"/></svg>`,
        `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 200 300"><path d="M100 0 C130 40 140 70 135 110 C160 130 165 180 150 220 L112 236 L112 300 L88 300 L88 236 L50 220 C35 180 40 130 65 110 C60 70 70 40 100 0 Z" fill="black"/></svg>`,
      ];

      const svgUrl = (svg) =>
        `data:image/svg+xml,${encodeURIComponent(svg)}`;

      const MASK_URLS =
        MASK_SRC === "svg" ? TREE_SVGS.map(svgUrl) : buildCanvasMasks();

      /* The wireframe's placeholder wagon, with the contract's intrinsic size
         added. Gives the car real raster content, as production's decoded
         sprite does. Copied 2026-09-08. */
      const CAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="330" y="790" width="170" height="90" rx="22" fill="#120c1c"/><rect x="1100" y="790" width="170" height="90" rx="22" fill="#120c1c"/><rect x="470" y="150" width="660" height="34" rx="10" fill="#c9c3b8"/><rect x="520" y="120" width="14" height="40" fill="#c9c3b8"/><rect x="1066" y="120" width="14" height="40" fill="#c9c3b8"/><path d="M300 330 C310 250 360 190 440 180 L1160 180 C1240 190 1290 250 1300 330 L1320 560 L1320 790 C1320 815 1300 830 1275 830 L325 830 C300 830 280 815 280 790 L280 560 Z" fill="#b9a38a"/><rect x="280" y="150" width="1040" height="50" rx="14" fill="#e9e2d6"/><rect x="320" y="560" width="960" height="170" rx="10" fill="#7a4b26"/><rect x="320" y="560" width="960" height="170" rx="10" fill="none" stroke="#e0c99a" stroke-width="8"/><rect x="380" y="215" width="840" height="300" rx="22" fill="#0b0616"/><path d="M540 515 C540 440 600 420 640 420 C690 420 740 445 740 515 Z" fill="#2a1a30"/><circle cx="640" cy="392" r="48" fill="#e8c5a0"/><path d="M860 515 C860 440 920 420 960 420 C1010 420 1060 445 1060 515 Z" fill="#2a1a30"/><circle cx="960" cy="392" r="48" fill="#e8c5a0"/><path d="M1035 372 L1075 300 L1095 320 L1070 380 Z" fill="#e8c5a0"/><rect x="300" y="560" width="60" height="170" rx="8" fill="#ff4a44"/><rect x="1240" y="560" width="60" height="170" rx="8" fill="#ff4a44"/><rect x="260" y="740" width="1080" height="56" rx="14" fill="#d9d6d2"/><rect x="700" y="752" width="200" height="34" rx="6" fill="#f2efe8"/></svg>`;

      /* ===================================================================
       * THE LOT — the DOM shape of theater/src/lot/build-lot.ts.
       * =================================================================== */
      function buildLot() {
        const pin = document.createElement("div");
        pin.className = "pin";

        const lot = document.createElement("div");
        lot.className = "sds-lot";
        lot.style.setProperty(
          "--sds-ground-line",
          `${Number((GROUND_LINE * 100).toFixed(4))}%`,
        );
        lot.style.setProperty("--sds-ground-lead", `${GROUND_LEAD}px`);
        lot.style.setProperty("--sds-ground-depth", `${GROUND_DEPTH}px`);
        if (ROAD_LIFTED) lot.dataset.road = "lifted";

        const world = document.createElement("div");
        world.className = "sds-lot__world";

        const ground = document.createElement("div");
        ground.className = "sds-lot__ground";
        world.appendChild(ground);

        /* Trees go inside the world, after the ground and before the screens,
           so the one drive tween moves them with everything else. */
        const trees = [];
        if (TREE_SPACING) {
          for (const p of treePlacements(SCREEN_COUNT, TREE_SPACING)) {
            const tree = document.createElement("span");
            tree.className = `sds-tree sds-tree--${p.side}`;
            tree.setAttribute("aria-hidden", "true");
            tree.setAttribute("data-tree-variant", String(p.variant));
            tree.setAttribute("data-mask", "pending");
            tree.style.setProperty("--sds-tree-x", `${p.x}px`);
            tree.style.setProperty("--sds-tree-z", `${p.z}px`);
            tree.style.setProperty("--sds-tree-scale", String(p.scale));
            const url = MASK_URLS[p.variant];
            tree.style.setProperty("-webkit-mask-image", `url("${url}")`);
            tree.style.setProperty("mask-image", `url("${url}")`);
            tree.setAttribute("data-mask", "ready");
            world.appendChild(tree);
            trees.push(tree);
          }
        }

        const screens = [];
        for (let i = 0; i < SCREEN_COUNT; i++) {
          const project = PROJECTS[i];
          const { x, z, yaw } = screenPlacement(i);

          const screen = document.createElement("a");
          screen.className = "sds-screen";
          screen.href = project.href;
          screen.setAttribute("data-screen-index", String(i));
          screen.style.setProperty("--sds-screen-x", `${x}px`);
          screen.style.setProperty("--sds-screen-z", `${z}px`);
          screen.style.setProperty("--sds-screen-yaw", `${yaw}deg`);
          screen.style.setProperty("--sds-screen-lit", "0");

          const surface = document.createElement("span");
          surface.className = "sds-screen__surface";
          surface.setAttribute("data-poster", "pending");

          const video = document.createElement("video");
          video.className = "sds-screen__video";
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          video.preload = "none";
          video.poster = project.poster;
          video.setAttribute("aria-hidden", "true");
          /* The four poster-only screens get NO <source> at all — production's
             fallback, not a cheaper stand-in for it. */
          if (project.clip) {
            const source = document.createElement("source");
            source.src = project.clip;
            source.type = "video/mp4";
            video.appendChild(source);
          }
          surface.appendChild(video);

          const base = document.createElement("span");
          base.className = "sds-screen__base";
          const postL = document.createElement("span");
          postL.className = "sds-screen__post sds-screen__post--l";
          const postR = document.createElement("span");
          postR.className = "sds-screen__post sds-screen__post--r";
          const marquee = document.createElement("span");
          marquee.className = "sds-screen__marquee";
          marquee.textContent = project.name;
          base.append(postL, postR, marquee);

          screen.append(surface, base);
          world.appendChild(screen);
          screens.push({ screen, surface, video, project });
        }

        lot.appendChild(world);

        /* The orb, the beam and the car hang off the STAGE, outside the world,
           so the lot drives past them. */
        if (HAS_CAR) {
          const orb = document.createElement("div");
          orb.className = "sds-lot__orb";
          orb.setAttribute("aria-hidden", "true");

          const beam = document.createElement("div");
          beam.className = "sds-lot__beam";
          beam.setAttribute("aria-hidden", "true");

          const car = document.createElement("div");
          car.className = "sds-lot__car";
          car.setAttribute("aria-hidden", "true");
          car.setAttribute("data-car", "ready");
          const carImg = document.createElement("img");
          carImg.alt = "";
          carImg.src = svgUrl(CAR_SVG);
          car.appendChild(carImg);

          lot.append(orb, beam, car);
        }

        pin.appendChild(lot);
        stage.appendChild(pin);
        return { world, screens, trees };
      }

      /* ===================================================================
       * THE POSTER GATE (see the header). Production keeps twenty decoded
       * posters resident inside the transformed world; a probe without them
       * measures a lighter page and would hand back a false GO.
       * =================================================================== */
      function decodePoster(url) {
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = url;
        });
      }

      async function placePosters(screens) {
        const images = await Promise.all(
          screens.map((s) => decodePoster(s.project.poster)),
        );
        let resident = 0;
        images.forEach((image, i) => {
          const { surface } = screens[i];
          if (!image || image.naturalWidth < 1) {
            surface.setAttribute("data-poster", "missing");
            return;
          }
          image.className = "sds-screen__poster";
          image.alt = "";
          surface.appendChild(image);
          surface.setAttribute("data-poster", "ready");
          resident += 1;
        });
        return resident;
      }

      /* ===================================================================
       * THE TIMELINE — the shape of theater/src/lot/build-lot.ts. One unit is
       * one screen's band; the drive is SCREEN_COUNT + 1 units long.
       *
       * NOT DTF's timeline: production tweens the NUMBER `--sds-screen-lit` and
       * lets the CSS derive brightness, marquee colour and glow. DTF tweened
       * `filter` and the marquee colours directly, which is a different
       * per-frame cost.
       * =================================================================== */
      function buildTimeline(world, screens) {
        const tl = gsap.timeline({ paused: true, defaults: { ease: "none" } });

        tl.fromTo(
          world,
          { z: 0 },
          { z: lotZ(1, SCREEN_COUNT), duration: BANDS, ease: "none" },
          0,
        );

        screens.forEach(({ screen }, i) => {
          const bandStart = screenProgress(i, SCREEN_COUNT) * BANDS;
          const bandEnd = screenProgress(i + 1, SCREEN_COUNT) * BANDS;

          tl.fromTo(
            screen,
            { "--sds-screen-lit": 0 },
            { "--sds-screen-lit": 1, duration: LIT_IN_BANDS, ease: "none" },
            bandStart,
          );
          tl.fromTo(
            screen,
            { "--sds-screen-lit": 1 },
            {
              "--sds-screen-lit": 0,
              duration: LIT_OUT_BANDS,
              ease: "none",
              /* Without this the whole lot is lit before it is driven: a
                 `fromTo` renders its `from` value at build time, writing "fully
                 lit" onto every screen the visitor has not reached yet. */
              immediateRender: false,
            },
            bandEnd,
          );
        });

        return tl;
      }

      /* Playing iff active, idempotent — production's rule. */
      function makePlayback(screens) {
        let playing = -1;
        return function setActive(next) {
          if (next === playing) return;
          if (playing >= 0) screens[playing].video.pause();
          playing = next;
          if (next >= 0) {
            const played = screens[next].video.play();
            if (played && played.catch) played.catch(() => {});
          }
        };
      }

      /* ===================================================================
       * The frame loop. Same shape as theater/src/engine.ts: tick Lenis, ONE
       * scroll read, one absolute seek. Nothing here measures layout.
       * =================================================================== */
      function run(tl, setActive) {
        const lenis = new Lenis({ autoRaf: false });

        let range = 1;
        const measure = () => {
          range = Math.max(
            1,
            document.documentElement.scrollHeight - window.innerHeight,
          );
        };
        measure();
        window.addEventListener("resize", measure);

        function frame(time) {
          /* Before the scroll read, not after: Lenis moves the page during this
             call, and reading first would drive the scene from last frame's
             position. */
          lenis.raf(time);

          const progress = Math.min(1, Math.max(0, window.scrollY / range));
          tl.progress(progress, true);
          setActive(activeScreen(progress, SCREEN_COUNT));

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      /* ===================================================================
       * THE CLASSIFIER — the ONE implementation of the header's decision
       * procedure. Pure: no DOM, no globals, no clock. renderSummary()
       * delegates to it, and ?selftest=verdict drives it directly.
       *
       * FAIL-CLOSED (EVO-UNI-120): any missing or non-numeric input returns
       * INVALID rather than falling through to a verdict.
       * =================================================================== */
      const FPS_FLOOR = 50;

      function classify(input) {
        const i = input || {};
        const num = (v) => typeof v === "number" && Number.isFinite(v);
        const bool = (v) => typeof v === "boolean";

        /* Everything steps 0-5 always consult. */
        if (
          !num(i.overloadFps) ||
          !num(i.sceneryFps) ||
          !num(i.halfFps) ||
          !num(i.carFps) ||
          !bool(i.carInteraction) ||
          !bool(i.treesPaint) ||
          !bool(i.sceneryInteraction)
        ) {
          return "INVALID";
        }

        /* 0. Instrument validity. The control must read lower, or the meter is
              not moving and no verdict may be drawn. */
        if (!(i.overloadFps < i.sceneryFps)) return "INVALID";

        /* 1. The car must be usable — before anything about trees. */
        if (!i.carInteraction) return "NO-GO-ALL";

        /* 2. The car must be fast enough, on the natural-wheel run. */
        if (!(i.carFps >= FPS_FLOOR)) return "NO-GO-ALL";

        /* 3-4. The trees must paint, and must not break interaction. From here
                down every failure is NO-GO-TREES: the car is already known good. */
        if (!i.treesPaint) return "NO-GO-TREES";
        if (!i.sceneryInteraction) return "NO-GO-TREES";

        /* 5. Density. */
        if (i.sceneryFps >= FPS_FLOOR) return "GO";
        if (i.halfFps >= FPS_FLOOR) {
          /* fps alone never selects a layout nobody has looked at, so the
             reduced layout's own paint and interaction checks are required —
             and fail-closed if they were never taken. */
          if (!bool(i.halfPaint) || !bool(i.halfInteraction)) return "INVALID";
          if (i.halfPaint && i.halfInteraction) return "GO-REDUCED";
        }
        return "NO-GO-TREES";
      }

      /* ===================================================================
       * THE CLASSIFIER'S SELF-TEST  (?selftest=verdict)
       *
       * A grep for the outcome words proves only that the words appear in the
       * header. This is the gate that proves the classifier implements the
       * procedure: every row states the vector and the outcome the header's
       * ordering requires. The probe REFUSES to render a verdict unless every
       * row matched in this session.
       * =================================================================== */
      const VERDICT_CASES = [
        {
          name: "invalid-precedence-beats-a-go-shaped-vector",
          /* Step 0 must win over a vector that would otherwise be a clean GO. */
          input: {
            overloadFps: 60,
            sceneryFps: 60,
            halfFps: 60,
            carFps: 60,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
          },
          expected: "INVALID",
        },
        {
          name: "car-interaction-fails-with-fps-fine-everywhere",
          /* The vector the OLD ordering got wrong: it returned NO-GO-TREES and
             shipped a car already known to be unclickable. The control is kept
             valid (overload 55 < scenery 60) precisely so step 0 does not
             pre-empt the step being tested. */
          input: {
            overloadFps: 55,
            sceneryFps: 60,
            halfFps: 60,
            carFps: 60,
            carInteraction: false,
            treesPaint: true,
            sceneryInteraction: true,
          },
          expected: "NO-GO-ALL",
        },
        {
          name: "car-only-below-the-floor",
          input: {
            overloadFps: 40,
            sceneryFps: 60,
            halfFps: 60,
            carFps: 45,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
          },
          expected: "NO-GO-ALL",
        },
        {
          name: "trees-do-not-paint-car-fine",
          input: {
            overloadFps: 40,
            sceneryFps: 60,
            halfFps: 60,
            carFps: 60,
            carInteraction: true,
            treesPaint: false,
            sceneryInteraction: true,
          },
          expected: "NO-GO-TREES",
        },
        {
          name: "scenery-interaction-fails",
          input: {
            overloadFps: 40,
            sceneryFps: 60,
            halfFps: 60,
            carFps: 60,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: false,
          },
          expected: "NO-GO-TREES",
        },
        {
          name: "go-45-55-58-60",
          input: {
            overloadFps: 45,
            sceneryFps: 55,
            halfFps: 58,
            carFps: 60,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
          },
          expected: "GO",
        },
        {
          name: "go-reduced-40-45-52-60-half-layout-checked",
          input: {
            overloadFps: 40,
            sceneryFps: 45,
            halfFps: 52,
            carFps: 60,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
            halfPaint: true,
            halfInteraction: true,
          },
          expected: "GO-REDUCED",
        },
        {
          name: "half-layout-does-not-paint",
          input: {
            overloadFps: 40,
            sceneryFps: 45,
            halfFps: 52,
            carFps: 60,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
            halfPaint: false,
            halfInteraction: true,
          },
          expected: "NO-GO-TREES",
        },
        {
          name: "everything-slow-30-40-45-48",
          input: {
            overloadFps: 30,
            sceneryFps: 40,
            halfFps: 45,
            carFps: 48,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
          },
          expected: "NO-GO-ALL",
        },
        {
          name: "fail-closed-scenery-fps-absent",
          input: {
            overloadFps: 40,
            halfFps: 60,
            carFps: 60,
            carInteraction: true,
            treesPaint: true,
            sceneryInteraction: true,
          },
          expected: "INVALID",
        },
      ];

      function runVerdictSelfTest() {
        const rows = VERDICT_CASES.map((c) => {
          const actual = classify(c.input);
          return { name: c.name, expected: c.expected, actual };
        });
        const allMatch = rows.every((r) => r.expected === r.actual);
        return { rows, allMatch };
      }

      function verdictSelfTestText(result) {
        const width = Math.max(...VERDICT_CASES.map((c) => c.name.length));
        const lines = result.rows.map(
          (r) =>
            `${r.name.padEnd(width)}  ${r.expected}/${r.actual}  ` +
            `${r.expected === r.actual ? "MATCH" : "*** MISMATCH ***"}`,
        );
        return (
          "DT11 verdict classifier self-test — case: EXPECTED/ACTUAL\n" +
          `${lines.join("\n")}\n\n` +
          `${result.rows.length} cases, ${result.rows.filter((r) => r.expected === r.actual).length} matched\n` +
          `RESULT: ${result.allMatch ? "all-match" : "MISMATCH — the classifier does not implement the header's procedure"}\n`
        );
      }

      function renderVerdictSelfTest() {
        const result = runVerdictSelfTest();
        const pre = document.getElementById("verdict-selftest");
        pre.textContent = verdictSelfTestText(result);
        pre.hidden = false;
        return result;
      }

      /* ===================================================================
       * MEASUREMENT  (?measure=all)
       *
       * Copied from DTF's harness. Its store key is its own (this one is
       * dt11-measure-results), its walk order is baseline-first (EVO-UNI-021),
       * and its summary is the five-outcome procedure above rather than DTF's
       * three bands.
       * =================================================================== */
      const MEASURE = PARAMS.get("measure");
      const MEASURE_ORDER = [
        "lot20",
        "car-only",
        "scenery",
        "scenery-half",
        "scenery-overload",
      ];
      const RUNS = 3;
      const RUN_MS = 10000;
      const SETTLE_MS = 1800;
      const STORE = "dt11-measure-results";
      /* Recorded when the gate passes, so ?verdict= can print the residency the
         medians were actually taken under rather than re-deriving it. */
      const POSTER_STORE = "dt11-posters-resident";

      /* The metric: the fewest frames landing in any contiguous 1 s window. */
      function lowestWindowFps(ts) {
        if (ts.length < 2) return 0;
        const last = ts[ts.length - 1];
        let min = Infinity;
        let j = 0;
        for (let i = 0; i < ts.length; i++) {
          if (ts[i] + 1000 > last) break;
          while (j < ts.length && ts[j] < ts[i] + 1000) j++;
          min = Math.min(min, j - i);
        }
        return min === Infinity ? 0 : min;
      }

      function median(values) {
        const sorted = [...values].sort((a, b) => a - b);
        return sorted[Math.floor(sorted.length / 2)];
      }

      function measureBox() {
        let el = document.getElementById("measure-overlay");
        if (!el) {
          el = document.createElement("div");
          el.id = "measure-overlay";
          el.style.cssText =
            "position:fixed;inset:auto 0 0 0;z-index:100;padding:14px 18px;" +
            "background:rgba(0,0,0,.88);color:#f0f0ff;border-top:2px solid #7c3aed;" +
            "font:13px/1.6 ui-monospace,monospace;white-space:pre;overflow:auto;" +
            "max-height:70vh";
          document.body.appendChild(el);
        }
        return el;
      }

      /* One 10 s run. The page is moved EVERY frame from wall-clock elapsed, so
         no frame is free and the trajectory is identical in every variant. */
      function runOnce() {
        return new Promise((resolve) => {
          window.scrollTo(0, 0);
          setTimeout(() => {
            const range = Math.max(
              1,
              document.documentElement.scrollHeight - window.innerHeight,
            );
            const stamps = [];
            let start = null;
            function tick(now) {
              if (start === null) start = now;
              const elapsed = now - start;
              stamps.push(now);
              window.scrollTo(0, Math.min(range, (elapsed / RUN_MS) * range));
              if (elapsed < RUN_MS) requestAnimationFrame(tick);
              else resolve(lowestWindowFps(stamps));
            }
            requestAnimationFrame(tick);
          }, SETTLE_MS);
        });
      }

      /* Read the manual inputs the harness cannot take: the natural-wheel fps
         and the click / Tab / paint observations. Absent -> undefined, which
         classify() turns into INVALID. */
      function manualInputs() {
        const num = (k) => {
          const raw = PARAMS.get(k);
          if (raw === null || raw.trim() === "") return undefined;
          const n = Number(raw);
          return Number.isFinite(n) ? n : NaN;
        };
        const flag = (k) => {
          const raw = PARAMS.get(k);
          if (raw === null) return undefined;
          if (raw === "1" || raw === "true" || raw === "yes") return true;
          if (raw === "0" || raw === "false" || raw === "no") return false;
          return undefined;
        };
        return {
          carFps: num("carFps"),
          carInteraction: flag("carInteraction"),
          treesPaint: flag("treesPaint"),
          sceneryInteraction: flag("sceneryInteraction"),
          halfPaint: flag("halfPaint"),
          halfInteraction: flag("halfInteraction"),
        };
      }

      /* ===================================================================
       * THE NATURAL-WHEEL RUN, MEASURED IN THE PAGE  (?wheel=1)
       *
       * The protocol's instrument was a DevTools performance recording. This is
       * the same METRIC through a different instrument: the page never scrolls
       * itself, you wheel-scroll it top to bottom at a reading pace, and it
       * prints the lowest number of frames in any contiguous 1 s window since
       * the last reset — the same `lowestWindowFps()` the harness uses, and the
       * same definition as the DevTools FPS track, read a different way. DTF
       * recorded that instrument swap as an accepted deviation for the harness;
       * this extends it to the wheel run.
       *
       * WHAT THIS PRESERVES, and it is the whole point of the second protocol:
       * the scroll comes from real wheel input, so Lenis's smoothing path and
       * the engine update run exactly as they do in production. That is what
       * `window.scrollTo()` bypasses and why a harness median may never be read
       * as an absolute.
       *
       * RECORDED LIMIT: rAF timestamps say when a callback ran, not when a
       * frame was presented. If the compositor drops frames while the main
       * thread keeps ticking, this reads high. It cannot read high in the other
       * direction — main-thread jank always shows — so a number ABOVE the floor
       * is the weaker claim and a number below it is solid.
       * =================================================================== */
      function wheelMeter() {
        const box = document.createElement("div");
        box.id = "wheel-meter";
        box.style.cssText =
          "position:fixed;inset:auto 0 0 0;z-index:100;padding:12px 18px;" +
          "background:rgba(0,0,0,.9);color:#f0f0ff;border-top:2px solid #7c3aed;" +
          "font:14px/1.7 ui-monospace,monospace;white-space:pre";
        document.body.appendChild(box);

        let stamps = [];
        let started = false;
        /* How far down the lot the run actually got — the DEEPEST point reached,
           not the distance travelled. Accumulated travel would let scrolling up
           and down in one spot report "100% of the lot" without the run ever
           passing a screen. */
        let deepest = 0;
        let lastY = window.scrollY;

        const reset = () => {
          stamps = [];
          started = false;
          deepest = 0;
          lastY = window.scrollY;
        };
        window.addEventListener("keydown", (e) => {
          if (e.key.toLowerCase() === "r") reset();
        });

        function tick(now) {
          const y = window.scrollY;
          /* The clock starts on the first real scroll, so time spent reading
             this box before touching the wheel is not counted as jank. */
          if (!started && Math.abs(y - lastY) > 0) started = true;
          if (started) {
            if (y > deepest) deepest = y;
            stamps.push(now);
            /* Keep a bounded buffer: only the worst window matters, and an
               unbounded array is its own performance problem. */
            if (stamps.length > 6000) stamps = stamps.slice(-4000);
          }
          lastY = y;

          const range = Math.max(
            1,
            document.documentElement.scrollHeight - window.innerHeight,
          );
          const fps = started ? lowestWindowFps(stamps) : 0;
          const covered = Math.min(100, Math.round((deepest / range) * 100));
          box.textContent =
            `NATURAL-WHEEL RUN — ${VARIANT}${ROAD_LIFTED || GROUND_DEPTH !== GROUND_DEPTH_SPEC ? "  *** DIAGNOSTIC FLAGS ON — not a recordable number ***" : ""}\n` +
            "wheel-scroll top to bottom at a natural reading pace. Do not use the scrollbar or keys.\n\n" +
            `  lowest fps over any contiguous 1 s window:  ${started ? fps : "—"}\n` +
            `  scrolled so far: ${covered}% of the lot   (get to 100%, then read the number)\n` +
            `  frames sampled: ${stamps.length}   press R to start over\n\n` +
            (started && covered >= 100
              ? fps >= FPS_FLOOR
                ? `  ${fps} >= 50 — clears the floor.`
                : `  ${fps} < 50 — BELOW the floor.`
              : "  (keep scrolling)");
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      /* What the gate saw when the medians were taken. `?` (never a number) if
         no run in this session ever passed it. */
      function postersResident() {
        const raw = sessionStorage.getItem(POSTER_STORE);
        return raw === null ? "?" : raw;
      }

      function summaryText(state) {
        const width = 18;
        const rows = MEASURE_ORDER.filter((v) => state[v]).map((v) => {
          const runs = state[v];
          return (
            `  ${v.padEnd(width)}` +
            `${runs.map((n) => String(n).padStart(6)).join("")}   median ${median(runs)}`
          );
        });

        const has = (v) => Array.isArray(state[v]) && state[v].length > 0;
        const med = (v) => (has(v) ? median(state[v]) : undefined);
        const overloadFps = med("scenery-overload");
        const sceneryFps = med("scenery");
        const halfFps = med("scenery-half");

        let control = "  CONTROL (EVO-UNI-120): not both variants measured yet\n";
        if (overloadFps != null && sceneryFps != null) {
          const moves = overloadFps < sceneryFps;
          control =
            `  CONTROL (EVO-UNI-120): scenery-overload ${overloadFps} ` +
            `${moves ? "<" : ">="} scenery ${sceneryFps}  ->  ` +
            `${moves ? "meter moves; the medians are meaningful" : "METER DID NOT MOVE — INVALID, no verdict may be drawn"}\n`;
        }

        /* The verdict, from the ONE classifier — refused unless its self-test
           passed in this session. */
        const selfTest = runVerdictSelfTest();
        const manual = manualInputs();
        const input = { overloadFps, sceneryFps, halfFps, ...manual };
        let verdict;
        if (!selfTest.allMatch) {
          verdict =
            "  VERDICT: REFUSED — the classifier's own self-test did not print\n" +
            "           all-match in this session. Open ?selftest=verdict, fix the\n" +
            "           probe, and do not record anything.\n";
        } else {
          const outcome = classify(input);
          const missing = Object.entries({
            carFps: manual.carFps,
            carInteraction: manual.carInteraction,
            treesPaint: manual.treesPaint,
            sceneryInteraction: manual.sceneryInteraction,
          })
            .filter(([, v]) => v === undefined)
            .map(([k]) => k);
          verdict =
            `  VERDICT (classify): ${outcome}\n` +
            (missing.length
              ? `  ...fail-closed on missing manual input: ${missing.join(", ")}.\n` +
                "     The harness cannot take these. Do the natural-wheel run and the\n" +
                "     click / Tab / paint checks, then reopen in THIS TAB with:\n" +
                `     ?verdict=1&carFps=<n>&carInteraction=<0|1>&treesPaint=<0|1>` +
                `&sceneryInteraction=<0|1>&halfPaint=<0|1>&halfInteraction=<0|1>\n`
              : "");
        }

        return (
          "DT11 scenery probe — IN-PAGE HARNESS (relative cost only; NEVER an absolute >= 50)\n" +
          "lowest fps over any contiguous 1 s window; 3 runs of 10 s, page driven top->bottom.\n" +
          "Every absolute >= 50 comparison comes from the natural-wheel DevTools run instead.\n" +
          `browser: ${navigator.userAgent}\n` +
          `viewport: ${window.innerWidth}x${window.innerHeight}  dpr: ${window.devicePixelRatio}\n` +
          `screens: ${SCREEN_COUNT}   posters resident: ${postersResident()}/${SCREEN_COUNT}   mask source: ${MASK_SRC}\n` +
          `ground: ${GROUND_DEPTH}px${GROUND_DEPTH === GROUND_DEPTH_SPEC ? " (DT13 as specified)" : ` *** DIAGNOSTIC — spec is ${GROUND_DEPTH_SPEC}px ***`}` +
          `   road: ${ROAD_LIFTED ? "*** DIAGNOSTIC — lifted 1px ***" : "coplanar (DT13 as specified)"}\n` +
          `verdict self-test: ${selfTest.allMatch ? "all-match" : "MISMATCH"}\n\n` +
          `  variant${" ".repeat(width - 7)}  run1  run2  run3\n${rows.join("\n")}\n\n` +
          control +
          verdict +
          "\nCopy this whole block back to the session, then write the roadmap's decision row."
        );
      }

      function renderSummary(state, box) {
        const text = summaryText(state);
        box.textContent = text;
        console.log(text);
      }

      async function measureFlow() {
        if (PARAMS.get("reset")) sessionStorage.removeItem(STORE);
        const state = JSON.parse(sessionStorage.getItem(STORE) || "{}");
        const box = measureBox();

        const runs = [];
        for (let r = 1; r <= RUNS; r++) {
          box.textContent =
            `MEASURING  ${VARIANT}  —  run ${r} of ${RUNS}  (${RUN_MS / 1000}s)\n` +
            "don't touch the window; it scrolls itself\n" +
            (Object.keys(state).length
              ? `done so far: ${Object.keys(state).join(", ")}`
              : "");
          runs.push(await runOnce());
        }
        state[VARIANT] = runs;
        sessionStorage.setItem(STORE, JSON.stringify(state));

        if (MEASURE === "all") {
          const next = MEASURE_ORDER.find((v) => !state[v]);
          if (next) {
            box.textContent = `${VARIANT} done (${runs.join(", ")}) — loading ${next}…`;
            location.href = `?variant=${next}&measure=all${FLAG_QUERY}`;
            return;
          }
        }
        renderSummary(state, box);
      }

      /* ===================================================================
       * BOOT
       * =================================================================== */
      if (PARAMS.get("selftest") === "verdict") {
        /* Nothing is built: this mode is about the classifier alone, and a
           driver reading #verdict-selftest should not wait on twenty posters. */
        renderVerdictSelfTest();
      } else if (PARAMS.get("verdict")) {
        /* Verdict-only: the medians and the residency both come from this
           session's storage, so nothing is built and nothing is measured. */
        renderSummary(
          JSON.parse(sessionStorage.getItem(STORE) || "{}"),
          measureBox(),
        );
      } else if (!window.gsap || !window.Lenis) {
        /* Refuse rather than measure a static page: a probe that silently
           reported a great fps because its libraries failed to load is a metric
           that cannot report a bad number (EVO-UNI-120). */
        fatal(
          "gsap and/or lenis failed to load from jsdelivr. This probe needs " +
            "network access. Do not record a measurement from this page.",
        );
      } else {
        const { world, screens, trees } = buildLot();
        run(buildTimeline(world, screens), makePlayback(screens));

        /* The diagnostic flags are named here, and ONLY when they are actually
           on, so "did the flag take?" is answered by looking at the page rather
           than by trusting the URL. */
        const flags =
          (GROUND_DEPTH !== GROUND_DEPTH_SPEC
            ? ` · <b class="bad">ground ${GROUND_DEPTH}px</b> (spec ${GROUND_DEPTH_SPEC})`
            : "") + (ROAD_LIFTED ? ` · <b class="bad">road lifted 1px</b>` : "");
        const base =
          ` · <b>${SCREEN_COUNT}</b> screens · <b>${trees.length}</b> trees` +
          ` · masks <b>${MASK_SRC}</b>${flags}`;
        hudStatus.innerHTML = `${base} · posters <b>…</b>`;

        placePosters(screens).then((resident) => {
          sessionStorage.setItem(POSTER_STORE, String(resident));
          const ok = resident === SCREEN_COUNT;
          hudStatus.innerHTML =
            `${base} · ` +
            `<span class="${ok ? "" : "bad"}">posters resident: ` +
            `<b>${resident}/${SCREEN_COUNT}</b></span>`;

          if (!ok) {
            /* Refuse to measure a lot that is missing raster textures — the
               number would be light and the GO would be false. */
            fatal(
              `posters resident: ${resident}/${SCREEN_COUNT}. Production keeps ` +
                "twenty decoded posters resident inside the transformed world, so a " +
                "lot missing any of them is a lighter workload than the shipped " +
                "page. This probe will not measure. Check that images/<slug>/01.png " +
                "resolves from this file:// path for every project.",
            );
            return;
          }

          if (PARAMS.get("wheel")) {
            wheelMeter();
            return;
          }
          if (MEASURE) measureFlow();
        });
      }
    </script>
  </body>
</html>
