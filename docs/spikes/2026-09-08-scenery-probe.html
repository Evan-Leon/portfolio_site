    ===========================================================================
    DT11 — FALSIFIER: do ~88 masked tree planes and a blurred car overlay keep
    the twenty-screen drive fast enough and still clickable?
    ===========================================================================

    Roadmap: docs/roadmaps/drive-in-theme-roadmap.md, phase DT11.
    Spec:    docs/superpowers/specs/2026-09-08-drive-in-theme-design.md,
             "Core assumption".

    This file SHIPS NOTHING. It is a throwaway measurement rig, kept as the
    receipt for one decision line. Open it directly over file://:

        file:///home/evan/EVOsystem/portfolio_site/docs/spikes/2026-09-08-scenery-probe.html?variant=scenery

    It is a copy of DTF's probe (docs/spikes/2026-08-25-transformed-video-probe.html,
    a FROZEN receipt — copied from, never edited) with its lot replaced by a
    transcription of the shipped lot, and its three-outcome verdict replaced by
    the five-outcome procedure below.

    ---------------------------------------------------------------------------
    WHAT IS MEASURED
    ---------------------------------------------------------------------------
    The drive-in THEME rests on one never-measured assumption: that roughly
    ninety static masked planes inside the transformed world, plus a
    stage-anchored car overlay carrying two blurred radial glows, keep the
    twenty-screen drive at >= 50 fps (DTF's band, lowest contiguous 1 s window)
    and leave every screen clickable and Tab-reachable — and that `mask-image`
    actually paints on a plane under `preserve-3d` in Chromium.

    DTF's transfer argument does not carry it. DTF found that decoder count
    dominates and the transform stack is close to free, and trees add neither
    decoders nor filters — but DTF measured a workload that is no longer
    production (eight screens, `filter` tweened directly, a 4800px ground), each
    masked plane is its own compositor layer, 88 of them exceed DTF's 32 screens,
    and the car's `filter: blur()` on two pseudo-elements is a per-frame raster
    cost DTF never had. So this probe runs BEFORE any scenery code is written.

    ---------------------------------------------------------------------------
    BROWSER SCOPE: CHROMIUM ONLY, DELIBERATELY
    ---------------------------------------------------------------------------
    Evan's ruling, 2026-09-08, after the Part 3B adversarial: the spec's core
    assumption named Chrome and Firefox while this phase said "Firefox if
    installed" and DT16 is Chromium-only — and there is no Firefox on this host,
    so the likely path was to ship having never tested the second browser. The
    supported-browser claim is narrowed rather than left unhonoured: this feature
    is verified on Chromium, the spec says so, and nothing here claims Firefox
    evidence. Firefox support, if wanted, is a later phase with its own
    measurement.

    ---------------------------------------------------------------------------
    THE FIVE VARIANTS  (?variant=… , or set VARIANT_OVERRIDE below)
    ---------------------------------------------------------------------------
    lot20             THE BASELINE (EVO-UNI-021), measured before anything is
                      added to it. Twenty screens, the lot CSS transcribed from
                      theater/src/styles/global.css lines 196-470 (class names
                      kept, so the comparison is honest), the timeline shape of
                      theater/src/lot/build-lot.ts (one world tween, per-screen
                      `--sds-screen-lit` fromTos, `immediateRender: false` on the
                      ramp-down), the DT13 ground and road, and the production
                      media pattern below. Nothing else.

    car-only          lot20 + the orb, the headlight beam and the car with its
                      two blurred (`filter: blur(6px)`) radial tail-light glows.
                      No trees.

    scenery           car-only + 88 masked tree planes — `treePlacements(20)` at
                      TREE_SPACING = 400. THE DEFAULT VARIANT.

    scenery-half      car-only + 44 planes — TREE_SPACING = 800. The GO-REDUCED
                      layout, measured rather than hoped for.

    scenery-overload  THE FAILING CONTROL (EVO-UNI-120). The same loop at
                      TREE_SPACING = 100, which yields 351 planes (176 left, 175
                      right) — about 4x `scenery`. A metric that cannot report a
                      bad number is not a measurement: if `scenery-overload` does
                      NOT read lower than `scenery`, the meter is not moving and
                      NO verdict may be drawn from this probe (step 0 below).

    ---------------------------------------------------------------------------
    THE PRODUCTION MEDIA PATTERN — in lot20, and therefore in every variant
    ---------------------------------------------------------------------------
    The whole GO decision rests on this being the shipped page's workload and not
    a lighter sketch of it.

    theater/src/lot/build-lot.ts (lines 270-291) gives every screen a video AND a
    poster URL; theater/src/lot/lot-scene.ts (lines 441-476) appends a DECODED
    poster <img> to every surface once the asset loader resolves. So production
    keeps twenty decoded raster textures resident inside the transformed world at
    all times. DTF's builder has videos, surfaces and marquees but no poster
    <img> at all, so a straight copy would measure a lot with twenty transformed
    raster textures missing — a materially lighter GPU-memory and paint workload
    than the shipped page, on which GO would be a false positive.

    Nor is "eight synthetic clips cycled across twenty screens errs heavy" safe
    in the other direction: cycling eight URLs lets the second and third use hit
    cache in a way sixteen distinct production URLs cannot, so the direction of
    that bias is unknown, not conservative. DTF's own eight probe clips are
    therefore NOT used here.

    What this probe builds is the POST-REVEAL PRODUCTION DOM:
      * the twenty real slugs, read from theater/src/projects.ts and hardcoded
        below (see the EVO-UNI-128 note);
      * every screen gets `video.poster` = its real poster;
      * the SIXTEEN slugs that have a clip on disk get a real <source>; the four
        that do not (spead-read, media-cloud-web-tools, media-cloud-vitals,
        showrunner-digest — re-probed on disk 2026-09-08) get NO <source> at all,
        exactly as production falls back to the poster;
      * all twenty posters are decoded through an Image and appended as
        <img class="sds-screen__poster"> BEFORE the measurement harness starts.

    THE GATE: the HUD prints `posters resident: N/20`. If N is not 20 the probe
    REFUSES to measure and shows a fatal banner, rather than reporting a light
    number from a lot that is missing textures (EVO-UNI-120).

    ---------------------------------------------------------------------------
    TWO MEASUREMENT PROTOCOLS, AND WHAT EACH ONE MAY DECIDE
    ---------------------------------------------------------------------------
    (1) THE IN-PAGE HARNESS  (?measure=all)  —  RELATIVE COST ONLY.
        Three 10 s runs per variant; the metric is the lowest number of frames in
        any contiguous 1 s window; the median of the three is the variant's
        number. The page scrolls itself (`window.scrollTo()` on every measurement
        rAF) so the trajectory is identical in every variant.

        WHAT IT CANNOT CARRY: the scene loop still calls `lenis.raf(time)`, but
        Lenis is never moving the page from wheel input, so production's actual
        frame path — Lenis under real wheel deltas, then the engine update
        (theater/src/engine.ts lines 323-350) — is idle for the whole
        measurement. All five variants share that bias, so comparing them against
        each other is sound and the EVO-UNI-120 control is sound. Reading an
        ABSOLUTE `>= 50` off it is not: a `scenery = 50` harness run would yield
        GO without ever measuring the interaction the number is promising.

    (2) THE NATURAL-WHEEL RUN  —  OWNS EVERY ABSOLUTE `>= 50`.
        Real wheel scrolling through the full lot at a natural reading pace,
        lowest fps over any contiguous 1 s window. Recorded for `car-only` and
        for whichever scenery variant step 5 is about to select. A harness
        median never decides an absolute threshold.

        INSTRUMENT, changed 2026-09-08 (Evan's call): the protocol named a Chrome
        DevTools performance recording. `?wheel=1` measures the SAME metric in
        the page instead — the page stops driving the scroll, you wheel it top to
        bottom, and it prints `lowestWindowFps()` live: the same function the
        harness uses and the same definition as the DevTools FPS track. What
        matters about this protocol is preserved exactly — the scroll comes from
        real wheel input, so Lenis's smoothing path and the engine update run as
        they do in production, which is the thing `window.scrollTo()` bypasses.
        DTF already recorded the rAF-timestamp instrument as an accepted
        deviation for the harness; this extends it to the wheel run.

        RECORDED LIMIT: rAF timestamps say when a callback ran, not when a frame
        was presented, so a compositor dropping frames while the main thread
        keeps ticking reads high. It cannot err the other way — main-thread jank
        always shows — so a number ABOVE the floor is the weaker claim, and a
        number below it is solid.

    Sampling conditions for both: Chromium, 1440x900 at 100% zoom, mains power,
    no other tab playing media. A result straddling a band boundary is resolved
    by the median, never by re-running until it passes.

    ---------------------------------------------------------------------------
    THE DECISION PROCEDURE (EVO-UNI-091) — WRITTEN BEFORE ANY NUMBER WAS TAKEN
    ---------------------------------------------------------------------------
    Ordered, exhaustive and mutually exclusive. THE CAR IS GATED BEFORE ANY TREE
    BRANCH: an earlier draft jumped from "trees do not paint" straight to the
    frame-rate step, so the vector (control valid, trees invisible, car-only
    60 fps, car-only click/Tab FAILS) returned NO-GO-TREES and shipped a car
    already known to be unusable. Found by the Part 3B adversarial, 2026-09-08.

      0. INSTRUMENT VALIDITY.  `scenery-overload` must read LOWER than `scenery`
         on the harness. If not -> INVALID: fix the probe, record nothing.

      1. THE CAR MUST BE USABLE.  In `car-only`: a click on screen 3 navigates to
         ../../projects/classic-golf.html, and Tab reaches the screens in DOM
         order. Either failing -> NO-GO-ALL. Nothing downstream ships a car that
         cannot be clicked, so this is checked before anything about trees.

      2. THE CAR MUST BE FAST ENOUGH.  `car-only >= 50` on the NATURAL-WHEEL run,
         else -> NO-GO-ALL.

      3. THE TREES MUST PAINT.  Trees visible as silhouettes on both sides in
         `scenery`, else -> NO-GO-TREES. (Steps 1-2 have already established the
         car is fine, so every failure from here down is NO-GO-TREES, never
         NO-GO-ALL.)

      4. THE TREES MUST NOT BREAK INTERACTION.  Click and Tab in `scenery` as in
         step 1, else -> NO-GO-TREES.

      5. DENSITY.  On the harness medians, with the absolute floor confirmed on
         the natural-wheel run for whichever variant is selected:
           `scenery >= 50`                                            -> GO
           else if `scenery-half >= 50` AND the reduced layout itself
             passes steps 3 and 4 when opened at ?variant=scenery-half -> GO-REDUCED
           else                                                       -> NO-GO-TREES
         (fps alone never selects a layout nobody has looked at.)

      Under GO or GO-REDUCED, also record the &masksrc=svg smoke: trees paint
      with SVG masks, fps within noise of the PNG run.

    WHAT EACH OUTCOME CHANGES DOWNSTREAM
      GO            DT15 as specified, TREE_SPACING = 400.
      GO-REDUCED    DT15 with TREE_SPACING = 800 and the reduced literals.
      NO-GO-TREES   DT14 needs the car only; DT15 and DT16 take their car-only
                    branch (no scenery.ts, no trees, no tree masks).
      NO-GO-ALL     DT14, DT15 and DT16 are not executed; the theme is DT12 +
                    DT13 (period, sky, ground, road).
      INVALID       No verdict, and no downstream change, until re-measured.

    ---------------------------------------------------------------------------
    THE VERDICT IS COMPUTED, AND THE COMPUTER IS TESTED
    ---------------------------------------------------------------------------
    A grep for the outcome words proves only that the words appear in this
    header — an implementation that unconditionally printed GO while naming all
    five outcomes in prose would satisfy it (EVO-UNI-120). So:

      * one pure `classify()` function implements the procedure above, and
        `renderSummary()` delegates to it. It is FAIL-CLOSED: any missing or
        non-numeric input returns INVALID rather than falling through.
      * `?selftest=verdict` runs `classify()` over a case table written into this
        file and prints `case: EXPECTED/ACTUAL` per row into <pre
        id="verdict-selftest">. A throwaway Playwright driver reads that element.
      * THE PROBE REFUSES TO RENDER A VERDICT unless that self-test printed
        all-match in the same session.

    To get the verdict once the manual inputs exist, open (medians are read from
    this session's sessionStorage, so run the harness in the same tab first):

        ?verdict=1&carFps=<n>&carInteraction=<0|1>&treesPaint=<0|1>
                  &sceneryInteraction=<0|1>&halfPaint=<0|1>&halfInteraction=<0|1>

    `renderSummary()` prints that URL, pre-filled, at the end of the harness walk.

    Copy this row into the roadmap's "Decision records" table.

    ---------------------------------------------------------------------------
    THE TWO MASK SOURCES  (&masksrc=png | svg — default png)
    ---------------------------------------------------------------------------
    png (default)  Three silhouettes drawn in-page on an 800x1200 canvas and
                   taken as `toDataURL('image/png')`. The probe must not depend
                   on DT14's art existing.

    svg            The SAME three silhouettes as the exported intrinsic-size SVG
                   placeholders — the identical constants docs/spikes/art-check.html
                   offers under "download placeholder set", carrying explicit
                   width="800" height="1200" — applied through
                   `mask-image: url(...)` on an SVG document instead of a raster
                   PNG. This exists because the SVG branch is the LIKELY art
                   outcome (the spec's recorded fallback) and the roadmap
                   otherwise first exercises SVG masks under `preserve-3d` in
                   DT15 — after the manual art phase and an implementation
                   commit. It does not need the full performance matrix: one
                   `?variant=scenery&masksrc=svg` run showing the trees paint and
                   fps within noise of the PNG run retires the risk.

                   RECORDED DEVIATION: DT15 will serve those SVGs as files under
                   theater/public/art/. This phase ships exactly two files, so
                   there is no third file to point at and the SVG is carried as a
                   `data:image/svg+xml,...` URL instead. What differs is the
                   transport; what is under test — an SVG document rasterised by
                   the CSS engine as a mask on a plane inside `preserve-3d` — is
                   the same path either way. The mask images are also mapped to
                   variant indices in the two sources' own order (the wireframe's
                   tree--1 is the conifer, the canvas variant 0 is the
                   deciduous), which is irrelevant to what is measured: three
                   distinct masks over the same number of planes. DT15 owns the
                   final silhouette-to-variant mapping.

    ---------------------------------------------------------------------------
    KNOWN LIMITS OF THIS RIG — read before interpreting the numbers
    ---------------------------------------------------------------------------
    1. THE HARNESS IS RELATIVE. Stated twice on purpose; see "Two measurement
       protocols" above. Do not read an absolute >= 50 off a harness median.
    2. SCREEN_COUNT IS HARDCODED AT 20 (EVO-UNI-128). It is a SNAPSHOT of
       `theater/src/projects.ts`'s length on 2026-09-08, not an input read from
       the registry — a file:// page cannot import a TypeScript module. If this
       probe is ever re-run, RE-READ the registry first and update SCREEN_COUNT,
       the twenty slugs, and which of them have a clip on disk. The tree counts
       (88 / 44 / 351) are all derived from it, so a stale 20 makes every plane
       count wrong too.
    3. The scroll range is 2500vh in every variant — production's own
       `100 + VH_PER_SCREEN * projects.length` for twenty screens. That is more
       than twice DTF's 1060vh, so the harness's 10 s traversal moves the world
       further per frame than a human wheel does. Identical in all five variants,
       so it does not distort the comparison; it is one more reason the absolute
       floor comes from the wheel run.
    4. The stage is `position: fixed` here, standing in for the pin the built
       page uses. `.sds-lot` itself keeps its shipped `position: relative;
       height: 100%` so the transcription stays verbatim.
    5. GSAP's own rAF ticker runs in every variant (importing gsap wakes it).
       That is also true in production and constant across the five, so it does
       not distort their comparison.
    6. gsap and lenis are pinned to the versions the vendored engine uses
       (gsap 3.15.0, lenis 1.3.26) and load from jsdelivr. With no network the
       probe refuses to run rather than silently measuring a static page.
    7. Only the lot is reproduced. There is no loader ring, no reveal, no exit
       beat and no period engine (DT12) — the sky and tokens are night, the base
       values. What is being measured is the lot's per-frame cost.
